<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-labelledby="akronLogoTitle">
    <title id="akronLogoTitle">Ákron</title>
    <defs>
        <linearGradient id="akronGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#8CA6BE" />
            <stop offset="100%" stop-color="#5C7A96" />
        </linearGradient>
    </defs>

    <!-- Asa esquerda -->
    <g fill="url(#akronGrad)">
        <polygon points="88,78 18,58 30,70 20,74 34,84 24,88 40,98 88,92" />
        <polygon points="88,100 30,92 40,102 30,106 44,114 34,118 52,124 88,112" />
        <polygon points="88,120 46,118 54,126 46,130 58,136 88,130" />
    </g>

    <!-- Asa direita (espelhada) -->
    <g fill="url(#akronGrad)" transform="translate(240,0) scale(-1,1)">
        <polygon points="88,78 18,58 30,70 20,74 34,84 24,88 40,98 88,92" />
        <polygon points="88,100 30,92 40,102 30,106 44,114 34,118 52,124 88,112" />
        <polygon points="88,120 46,118 54,126 46,130 58,136 88,130" />
    </g>

    <!-- Escudo -->
    <path d="M120,18 L166,52 L166,118 L145,146 L134,146 L134,132 L120,148 L106,132 L106,146 L95,146 L74,118 L74,52 Z"
          fill="none" stroke="url(#akronGrad)" stroke-width="7" stroke-linejoin="round" />

    <!-- Marcas inferiores do escudo -->
    <rect x="88" y="150" width="12" height="12" fill="url(#akronGrad)" transform="rotate(45 94 156)" />
    <rect x="140" y="150" width="12" height="12" fill="url(#akronGrad)" transform="rotate(45 146 156)" />

    <!-- Monograma A -->
    <path d="M120,54 L146,128 L133,128 L120,90 L107,128 L94,128 Z" fill="url(#akronGrad)" />
    <rect x="108" y="106" width="24" height="9" fill="url(#akronGrad)" />
</svg>
